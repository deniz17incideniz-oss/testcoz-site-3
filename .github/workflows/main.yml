name: Generate Test HTML

on:
  repository_dispatch:
    types:
      - new-test-uploaded

  workflow_dispatch:
    inputs:
      file_id:
        required: true
        type: string

      file_name:
        required: true
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd automation
          npm ci

      - name: Get file info
        id: fileinfo
        env:
          FILE_ID: ${{ github.event.client_payload.file_id || github.event.inputs.file_id }}
          FILE_NAME: ${{ github.event.client_payload.file_name || github.event.inputs.file_name }}
        run: |
          [[ "$FILE_ID" =~ ^[A-Za-z0-9_-]+$ ]] || exit 1
          [[ "$FILE_NAME" =~ ^[a-z0-9][a-z0-9-]*\.docx$ ]] || exit 1

          echo "file_id=$FILE_ID" >> $GITHUB_OUTPUT
          echo "file_name=$FILE_NAME" >> $GITHUB_OUTPUT

          SLUG="${FILE_NAME%.docx}"
          echo "slug=$SLUG" >> $GITHUB_OUTPUT

      - name: Download DOCX
        env:
          FILE_ID: ${{ steps.fileinfo.outputs.file_id }}
          FILE_NAME: ${{ steps.fileinfo.outputs.file_name }}
        run: |

          mkdir -p /tmp/testcoz

          curl --fail --location --max-time 120 "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t" \
            -o "/tmp/testcoz/${FILE_NAME}"

          echo "=== FILE TYPE ==="
          file "/tmp/testcoz/${FILE_NAME}"

          echo "=== FILE SIZE ==="
          ls -lh "/tmp/testcoz/${FILE_NAME}"

          unzip -t "/tmp/testcoz/${FILE_NAME}"

      - name: Generate HTML
        env:
          FILE_NAME: ${{ steps.fileinfo.outputs.file_name }}
          SLUG: ${{ steps.fileinfo.outputs.slug }}
        run: |

          mkdir -p tests

          node automation/generate-test.js \
            "/tmp/testcoz/${FILE_NAME}" \
            "tests/${SLUG}.html"

      - name: Git config
        run: |
          git config user.name "testcoz-bot"
          git config user.email "bot@testcoz.pro"

      - name: Commit
        env:
          SLUG: ${{ steps.fileinfo.outputs.slug }}
        run: |
          git add tests/

          git commit -m "Yeni test: $SLUG" || echo "No changes"

      - name: Push
        run: |
          git pull --rebase origin main
          git push

      - name: Done
        run: |
          echo "Workflow tamamlandı"

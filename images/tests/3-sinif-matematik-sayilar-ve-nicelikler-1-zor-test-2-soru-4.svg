<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Dağların yükseklikleri</title><desc id="desc">Aşağıdaki tabloda üç farklı dağın yükseklikleri verilmiştir:
- K Dağı: Sekiz yüz on iki metre
- L Dağı: 8 yüzlük + 2 onluk
- M Dağı: 800 + 4
Bu dağların yüksekliklerinin büyükten küçüğe doğru sıralanışı hangisidir?</desc><style>.title{font:700 24px Arial,sans-serif;fill:#1E3A8A}.label{font:600 15px Arial,sans-serif;fill:#334155}.small{font:500 14px Arial,sans-serif;fill:#475569}.value{font:700 17px Arial,sans-serif;fill:#1E293B}.coin{font:700 18px Arial,sans-serif;fill:#92400E}.equation{font:700 36px Arial,sans-serif;fill:#1E3A8A}</style><rect width="720" height="360" rx="24" fill="#F8FAFC"/><rect x="18" y="18" width="684" height="324" rx="20" fill="#fff" stroke="#DBEAFE" stroke-width="3"/><text x="360" y="65" text-anchor="middle" class="title">Dağların yükseklikleri</text><path d="M45 245L130 125L215 245Z" fill="#94a3b8" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="275" text-anchor="middle" font-family="Arial" font-size="19" fill="#1e293b">K</text><text x="130" y="305" text-anchor="middle" font-family="Arial" font-size="15" fill="#1e293b">Sekiz yüz on iki metre</text><path d="M275 245L360 125L445 245Z" fill="#94a3b8" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="275" text-anchor="middle" font-family="Arial" font-size="19" fill="#1e293b">L</text><text x="360" y="305" text-anchor="middle" font-family="Arial" font-size="15" fill="#1e293b">8 yüzlük + 2 onluk</text><path d="M505 245L590 125L675 245Z" fill="#94a3b8" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="590" y="275" text-anchor="middle" font-family="Arial" font-size="19" fill="#1e293b">M</text><text x="590" y="305" text-anchor="middle" font-family="Arial" font-size="15" fill="#1e293b">800 + 4</text></svg>
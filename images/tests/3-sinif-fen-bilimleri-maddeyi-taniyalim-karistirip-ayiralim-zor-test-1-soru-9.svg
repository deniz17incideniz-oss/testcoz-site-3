<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 302" role="img" aria-labelledby="title desc"><title id="title">Ayırma planı</title><desc id="desc">Ayırma sırası: karışımda iri çakıl, demir ataş ve mıknatısın çekmediği kum var. Mıknatıs yalnızca ataşları alıyor. Kumu geçirip çakılı tutan bir elek de var. Geri kalan nasıl ayrılır?</desc><style>.title{font:700 24px Arial,sans-serif;fill:#1E3A8A}.label{font:600 15px Arial,sans-serif;fill:#334155}.small{font:500 14px Arial,sans-serif;fill:#475569}.value{font:700 17px Arial,sans-serif;fill:#1E293B}.coin{font:700 18px Arial,sans-serif;fill:#92400E}.equation{font:700 36px Arial,sans-serif;fill:#1E3A8A}</style><rect width="720" height="302" rx="24" fill="#F8FAFC"/><rect x="18" y="18" width="684" height="266" rx="20" fill="#fff" stroke="#DBEAFE" stroke-width="3"/><text x="360" y="65" text-anchor="middle" class="title">Ayırma planı</text><rect x="45" y="96" width="630" height="90" rx="5" fill="#f1f5f9" stroke="#2563eb" stroke-width="2"/><text x="65" y="133" style="font:22px Arial;fill:#1f2937">İri çakıl, demir ataş ve mıknatısın çekmediği</text><text x="65" y="163" style="font:22px Arial;fill:#1f2937">kum</text><rect x="45" y="200" width="630" height="60" rx="5" fill="#f1f5f9" stroke="#2563eb" stroke-width="2"/><text x="65" y="237" style="font:22px Arial;fill:#1f2937">Mıknatısla yalnızca ataşlar alındı</text></svg>
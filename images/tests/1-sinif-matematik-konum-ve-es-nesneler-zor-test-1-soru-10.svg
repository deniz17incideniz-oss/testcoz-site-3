<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">Üç ölçüte göre eş</title><desc id="desc">Görselde örnek şeklin eşini bulmak için renk, şekil ve büyüklük birlikte inceleniyor. Hangi kart tam eştir?</desc><style>.title{font:700 24px Arial,sans-serif;fill:#1E3A8A}.label{font:600 15px Arial,sans-serif;fill:#334155}.small{font:500 14px Arial,sans-serif;fill:#475569}.value{font:700 17px Arial,sans-serif;fill:#1E293B}.coin{font:700 18px Arial,sans-serif;fill:#92400E}.equation{font:700 36px Arial,sans-serif;fill:#1E3A8A}</style><rect width="720" height="300" rx="24" fill="#F8FAFC"/><rect x="18" y="18" width="684" height="264" rx="20" fill="#fff" stroke="#DBEAFE" stroke-width="3"/><text x="360" y="65" text-anchor="middle" class="title">Üç ölçüte göre eş</text><polygon points="80,126 56,174 104,174" fill="green" transform="rotate(0 80 150)"/><text x="80" y="225" text-anchor="middle" class="value">Örnek</text><polygon points="220,126 196,174 244,174" fill="red" transform="rotate(0 220 150)"/><text x="220" y="225" text-anchor="middle" class="value">A</text><circle cx="360" cy="150" r="24" fill="green"/><text x="360" y="225" text-anchor="middle" class="value">B</text><polygon points="500,126 476,174 524,174" fill="green" transform="rotate(0 500 150)"/><text x="500" y="225" text-anchor="middle" class="value">C</text><polygon points="640,138 628,162 652,162" fill="green" transform="rotate(0 640 150)"/><text x="640" y="225" text-anchor="middle" class="value">D</text></svg>
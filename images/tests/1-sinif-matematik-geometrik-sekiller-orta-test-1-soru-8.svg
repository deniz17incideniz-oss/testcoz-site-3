<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">Şekilleri grupla</title><desc id="desc">Görselde şekiller kenar sayılarına göre üç gruba ayrılıyor. Üçgen hangi gruba gitmelidir?</desc><style>.title{font:700 24px Arial,sans-serif;fill:#1E3A8A}.label{font:600 15px Arial,sans-serif;fill:#334155}.small{font:500 14px Arial,sans-serif;fill:#475569}.value{font:700 17px Arial,sans-serif;fill:#1E293B}.coin{font:700 18px Arial,sans-serif;fill:#92400E}.equation{font:700 36px Arial,sans-serif;fill:#1E3A8A}</style><rect width="720" height="300" rx="24" fill="#F8FAFC"/><rect x="18" y="18" width="684" height="264" rx="20" fill="#fff" stroke="#DBEAFE" stroke-width="3"/><text x="360" y="65" text-anchor="middle" class="title">Şekilleri grupla</text><text x="130" y="110" text-anchor="middle" class="value">3 kenar</text><polygon points="100,160 75,210 125,210" fill="#2563EB" transform="rotate(0 100 185)"/><text x="360" y="110" text-anchor="middle" class="value">4 kenar</text><rect x="305" y="160" width="50" height="50" rx="8" fill="#2563EB" transform="rotate(0 330 185)"/><rect x="362.5" y="165" width="65" height="40" rx="8" fill="#2563EB" transform="rotate(0 395 185)"/><text x="590" y="110" text-anchor="middle" class="value">Köşesiz</text><circle cx="560" cy="185" r="25" fill="#2563EB"/></svg>
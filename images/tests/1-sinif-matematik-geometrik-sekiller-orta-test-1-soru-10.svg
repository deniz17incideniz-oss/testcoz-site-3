<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">Şekillerden robot</title><desc id="desc">Görselde bir robot 1 kare gövde, 2 dikdörtgen kol ve 1 çember baştan yapılmıştır. Kaç dört kenarlı şekil kullanılmıştır?</desc><style>.title{font:700 24px Arial,sans-serif;fill:#1E3A8A}.label{font:600 15px Arial,sans-serif;fill:#334155}.small{font:500 14px Arial,sans-serif;fill:#475569}.value{font:700 17px Arial,sans-serif;fill:#1E293B}.coin{font:700 18px Arial,sans-serif;fill:#92400E}.equation{font:700 36px Arial,sans-serif;fill:#1E3A8A}</style><rect width="720" height="300" rx="24" fill="#F8FAFC"/><rect x="18" y="18" width="684" height="264" rx="20" fill="#fff" stroke="#DBEAFE" stroke-width="3"/><text x="360" y="65" text-anchor="middle" class="title">Şekillerden robot</text><rect x="320" y="150" width="80" height="80" rx="8" fill="#2563EB" transform="rotate(0 360 190)"/><rect x="231" y="161" width="78" height="48" rx="8" fill="#2563EB" transform="rotate(0 270 185)"/><rect x="411" y="161" width="78" height="48" rx="8" fill="#2563EB" transform="rotate(0 450 185)"/><circle cx="360" cy="115" r="25" fill="#d97706"/></svg>
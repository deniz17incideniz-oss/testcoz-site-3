<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="title desc"><title id="title">Okunan kitaplar</title><desc id="desc">4-A ve 4-B sınıfları birlikte 100 kitap okuma hedefi belirledi. Grafik, bu sınıfların şimdiye kadar okuduğu kitap sayılarını gösteriyor. 4-B sınıfındaki 22 öğrenci, hedefe ulaşmak için kalan kitapların her birini yalnız bir öğrenci okuyacak şekilde eşit paylaşıyor. Buna göre her öğrenci kaç kitap okuyacaktır?</desc><style>.title{font:700 24px Arial,sans-serif;fill:#1E3A8A}.label{font:600 15px Arial,sans-serif;fill:#334155}.small{font:500 14px Arial,sans-serif;fill:#475569}.value{font:700 17px Arial,sans-serif;fill:#1E293B}.coin{font:700 18px Arial,sans-serif;fill:#92400E}.equation{font:700 36px Arial,sans-serif;fill:#1E3A8A}</style><rect width="360" height="300" rx="24" fill="#F8FAFC"/><rect x="18" y="18" width="324" height="264" rx="20" fill="#fff" stroke="#DBEAFE" stroke-width="3"/><text x="180" y="65" text-anchor="middle" class="title">Okunan kitaplar</text><text x="180" y="102" text-anchor="middle" style="font:600 19px Arial;fill:#334155">Her kitap resmi</text><text x="180" y="125" text-anchor="middle" style="font:600 19px Arial;fill:#334155">4 kitabı gösterir.</text><rect x="24" y="145" width="312" height="55" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="45" y="180" style="font:700 19px Arial;fill:#1e293b">4-A</text><g class="book-icon"><rect x="91" y="158" width="22" height="29" rx="2" fill="#2563eb"/><path d="M96 159v27 M100 164h9 M100 169h9" fill="none" stroke="#fff" stroke-width="1.5"/></g><g class="book-icon"><rect x="121" y="158" width="22" height="29" rx="2" fill="#2563eb"/><path d="M126 159v27 M130 164h9 M130 169h9" fill="none" stroke="#fff" stroke-width="1.5"/></g><g class="book-icon"><rect x="151" y="158" width="22" height="29" rx="2" fill="#2563eb"/><path d="M156 159v27 M160 164h9 M160 169h9" fill="none" stroke="#fff" stroke-width="1.5"/></g><g class="book-icon"><rect x="1
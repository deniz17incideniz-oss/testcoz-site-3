<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Gökyüzündeki kuş</title><desc id="desc">Metin: &quot;Kartallar yüksek dağ zirvelerine yuva yaparlar. Keskin gözleri sayesinde kilometrelerce yüksekten avlarını görebilirler. Gökyüzünün bu muhteşem avcıları, saatte yüzlerce kilometre hıza ulaşarak avlarına dalış yaparlar.&quot;
Bu metnin başlığı aşağıdakilerden hangisi olursa metnin içeriğini **en kapsamlı** şekilde yansıtır?</desc><style>.title{font:700 24px Arial,sans-serif;fill:#1E3A8A}.label{font:600 15px Arial,sans-serif;fill:#334155}.small{font:500 14px Arial,sans-serif;fill:#475569}.value{font:700 17px Arial,sans-serif;fill:#1E293B}.coin{font:700 18px Arial,sans-serif;fill:#92400E}.equation{font:700 36px Arial,sans-serif;fill:#1E3A8A}</style><rect width="720" height="360" rx="24" fill="#F8FAFC"/><rect x="18" y="18" width="684" height="324" rx="20" fill="#fff" stroke="#DBEAFE" stroke-width="3"/><text x="360" y="65" text-anchor="middle" class="title">Gökyüzündeki kuş</text><path d="M90 200L290 150L350 177L430 144L620 205L435 191L378 220L360 267L335 220L270 193Z" fill="#78350f" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="369" cy="185" r="17" fill="#f1f5f9"/><path d="M382 182l22 7l-22 8" fill="#eab308" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M80 325L160 250L230 325M460 325L540 240L650 325" fill="#cbd5e1" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
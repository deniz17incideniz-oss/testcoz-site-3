<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 478" role="img" aria-labelledby="title desc"><title id="title">İki yol, bir karar</title><desc id="desc">3. sınıf zor: Ailem ve Toplum karar görselinde “aile toplantısında herkesin görüşünü dinleyerek görev çizelgesi hazırladı” ve “ortak sorumlulukları sürekli başkasına bırakmak” yolları vardır. Doğru yolun en güçlü gerekçesi hangisidir?</desc><style>.title{font:700 24px Arial,sans-serif;fill:#1E3A8A}.label{font:600 15px Arial,sans-serif;fill:#334155}.small{font:500 14px Arial,sans-serif;fill:#475569}.value{font:700 17px Arial,sans-serif;fill:#1E293B}.coin{font:700 18px Arial,sans-serif;fill:#92400E}.equation{font:700 36px Arial,sans-serif;fill:#1E3A8A}</style><rect width="720" height="478" rx="24" fill="#F8FAFC"/><rect x="18" y="18" width="684" height="442" rx="20" fill="#fff" stroke="#DBEAFE" stroke-width="3"/><text x="360" y="65" text-anchor="middle" class="title">İki yol, bir karar</text><rect x="45" y="96" width="630" height="104" rx="5" fill="#f1f5f9" stroke="#2563eb" stroke-width="2"/><text x="65" y="123" class="value">Bilgi</text><text x="65" y="153" style="font:22px Arial;fill:#1f2937">aile toplantısında herkesin görüşünü</text><text x="65" y="183" style="font:22px Arial;fill:#1f2937">dinleyerek görev çizelgesi hazırladı</text><rect x="45" y="214" width="630" height="104" rx="5" fill="#f1f5f9" stroke="#2563eb" stroke-width="2"/><text x="65" y="241" class="value">B</text><text x="65" y="271" style="font:22px Arial;fill:#1f2937">ortak sorumlulukları sürekli başkasına</text><text x="65" y="301" style="font:22px Arial;fill:#1f2937">bırakmak</text><rect x="45" y="332" width="630" height="104" rx="5" fill="#f1f5f9" stroke="#2563eb" stroke-width="2"/><text x="65" y="359" class="value">Bilgi</text><text x="65" y="389" style="font:22px Arial;fill:#1f2937">işlerin adil paylaşılması ve herkesin</text><text x="65" y="419" style="font:22px Arial;fill:#1f2937">dinlenmesi</text></svg>
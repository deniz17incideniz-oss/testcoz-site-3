<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">Eş para değerleri</title><desc id="desc">Görselde 100 TL bir tarafta, iki eş 50 TL kartı diğer taraftadır. Değerler için hangisi doğrudur?</desc><style>.title{font:700 24px Arial,sans-serif;fill:#1E3A8A}.label{font:600 15px Arial,sans-serif;fill:#334155}.small{font:500 14px Arial,sans-serif;fill:#475569}.value{font:700 17px Arial,sans-serif;fill:#1E293B}.coin{font:700 18px Arial,sans-serif;fill:#92400E}.equation{font:700 36px Arial,sans-serif;fill:#1E3A8A}</style><rect width="720" height="300" rx="24" fill="#F8FAFC"/><rect x="18" y="18" width="684" height="264" rx="20" fill="#fff" stroke="#DBEAFE" stroke-width="3"/><text x="360" y="65" text-anchor="middle" class="title">Eş para değerleri</text><path d="M330 250 L360 145 L390 250 Z" fill="#94a3b8"/><line x1="175" y1="150" x2="545" y2="150" stroke="#475569" stroke-width="7"/><rect x="105" y="165" width="140" height="55" rx="5" fill="#DBEAFE" stroke="#2563eb" stroke-width="2"/><rect x="475" y="165" width="140" height="55" rx="5" fill="#DBEAFE" stroke="#2563eb" stroke-width="2"/><text x="175" y="200" text-anchor="middle" class="value">100 TL</text><text x="545" y="200" text-anchor="middle" class="value">50+50 TL</text></svg>
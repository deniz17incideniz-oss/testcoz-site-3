<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 350" role="img" aria-labelledby="title desc"><title id="title">Gözlem kayıtları</title><desc id="desc">İki kayaç aynı cisimle, aynı kuvvet uygulanarak çizilmeye çalışılıyor. Kayıtları değerlendirmek için sonraki adım ne olabilir?</desc><style>.title{font:700 24px Arial,sans-serif;fill:#1E3A8A}.label{font:600 15px Arial,sans-serif;fill:#334155}.small{font:500 14px Arial,sans-serif;fill:#475569}.value{font:700 17px Arial,sans-serif;fill:#1E293B}.coin{font:700 18px Arial,sans-serif;fill:#92400E}.equation{font:700 36px Arial,sans-serif;fill:#1E3A8A}</style><rect width="480" height="350" rx="24" fill="#F8FAFC"/><rect x="18" y="18" width="444" height="314" rx="20" fill="#fff" stroke="#DBEAFE" stroke-width="3"/><text x="240" y="65" text-anchor="middle" class="title">Gözlem kayıtları</text><rect x="25" y="96" width="430" height="99" rx="5" fill="#f1f5f9" stroke="#2563eb" stroke-width="2"/><text x="45" y="123" style="font:700 21px Arial;fill:#1e293b">1. kayıt</text><text x="45" y="160" style="font:28px Arial;fill:#1f2937">1. kayaç: çizildi.</text><rect x="25" y="209" width="430" height="99" rx="5" fill="#f1f5f9" stroke="#2563eb" stroke-width="2"/><text x="45" y="236" style="font:700 21px Arial;fill:#1e293b">2. kayıt</text><text x="45" y="273" style="font:28px Arial;fill:#1f2937">2. kayaç: çizilmedi.</text></svg>
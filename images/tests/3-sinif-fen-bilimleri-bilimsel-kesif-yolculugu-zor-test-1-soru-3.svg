<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 506" role="img" aria-labelledby="title desc"><title id="title">Gözlem ve yorum</title><desc id="desc">3. sınıf Fen zor — Bilimsel Keşif Yolculuğu: Hangisi gözlem ile yorum arasındaki farkı doğru gösterir?</desc><style>.title{font:700 24px Arial,sans-serif;fill:#1E3A8A}.label{font:600 15px Arial,sans-serif;fill:#334155}.small{font:500 14px Arial,sans-serif;fill:#475569}.value{font:700 17px Arial,sans-serif;fill:#1E293B}.coin{font:700 18px Arial,sans-serif;fill:#92400E}.equation{font:700 36px Arial,sans-serif;fill:#1E3A8A}</style><rect width="480" height="506" rx="24" fill="#F8FAFC"/><rect x="18" y="18" width="444" height="470" rx="20" fill="#fff" stroke="#DBEAFE" stroke-width="3"/><text x="240" y="65" text-anchor="middle" class="title">Gözlem ve yorum</text><rect x="25" y="96" width="430" height="177" rx="5" fill="#f1f5f9" stroke="#2563eb" stroke-width="2"/><text x="45" y="123" style="font:700 21px Arial;fill:#1e293b">Gözlem</text><text x="45" y="160" style="font:28px Arial;fill:#1f2937">Güneşteki buz</text><text x="45" y="199" style="font:28px Arial;fill:#1f2937">gölgedekinden önce</text><text x="45" y="238" style="font:28px Arial;fill:#1f2937">eridi.</text><rect x="25" y="287" width="430" height="177" rx="5" fill="#f1f5f9" stroke="#2563eb" stroke-width="2"/><text x="45" y="314" style="font:700 21px Arial;fill:#1e293b">Yorum</text><text x="45" y="351" style="font:28px Arial;fill:#1f2937">Güneş, bu denemede</text><text x="45" y="390" style="font:28px Arial;fill:#1f2937">erimeyi hızlandırmış</text><text x="45" y="429" style="font:28px Arial;fill:#1f2937">olabilir.</text></svg>
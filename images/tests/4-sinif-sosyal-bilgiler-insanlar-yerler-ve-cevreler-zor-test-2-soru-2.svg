<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Mahalle krokisi</title><desc id="desc">Aşağıda bir mahallenin krokisi verilmiştir. Krokide okul, kütüphanenin kuzeyinde; hastane ise kütüphanenin doğusundadır.
Okuldan çıkıp hastaneye gitmek isteyen bir öğrenci, en kısa yoldan gitmek için sırasıyla hangi yönlere doğru yürümelidir? (Çapraz gitme seçeneği yoktur).</desc><style>.title{font:700 24px Arial,sans-serif;fill:#1E3A8A}.label{font:600 15px Arial,sans-serif;fill:#334155}.small{font:500 14px Arial,sans-serif;fill:#475569}.value{font:700 17px Arial,sans-serif;fill:#1E293B}.coin{font:700 18px Arial,sans-serif;fill:#92400E}.equation{font:700 36px Arial,sans-serif;fill:#1E3A8A}</style><rect width="720" height="360" rx="24" fill="#F8FAFC"/><rect x="18" y="18" width="684" height="324" rx="20" fill="#fff" stroke="#DBEAFE" stroke-width="3"/><text x="360" y="65" text-anchor="middle" class="title">Mahalle krokisi</text><path d="M260 135V265H500" fill="none" stroke="#cbd5e1" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/><rect x="190" y="90" width="140" height="55" rx="5" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="260" y="124" text-anchor="middle" font-family="Arial" font-size="19" fill="#1e293b">Okul</text><rect x="185" y="250" width="155" height="60" rx="5" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="260" y="287" text-anchor="middle" font-family="Arial" font-size="19" fill="#1e293b">Kütüphane</text><rect x="440" y="250" width="150" height="60" rx="5" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="515" y="287" text-anchor="middle" font-family="Arial" font-size="19" fill="#1e293b">Hastane</text><text x="590" y="118" text-anchor="middle" font-family="Arial" font-size="19" fill="#1e293b">Kuzey ↑</text></svg>
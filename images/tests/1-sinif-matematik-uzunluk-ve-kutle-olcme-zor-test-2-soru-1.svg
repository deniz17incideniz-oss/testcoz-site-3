<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="title desc"><title id="title">Kalem ve defter ölçüleri</title><desc id="desc">Bir kalem 6 silgi boyunda, bir defter 9 silgi boyundadır. Hangisi daha uzundur?</desc><style>.title{font:700 24px Arial,sans-serif;fill:#1E3A8A}.label{font:600 15px Arial,sans-serif;fill:#334155}.small{font:500 14px Arial,sans-serif;fill:#475569}.value{font:700 17px Arial,sans-serif;fill:#1E293B}.coin{font:700 18px Arial,sans-serif;fill:#92400E}.equation{font:700 36px Arial,sans-serif;fill:#1E3A8A}</style><rect width="720" height="250" rx="24" fill="#F8FAFC"/><rect x="18" y="18" width="684" height="214" rx="20" fill="#fff" stroke="#DBEAFE" stroke-width="3"/><text x="360" y="65" text-anchor="middle" class="title">Kalem ve defter ölçüleri</text><rect x="130" y="95" width="460" height="55" rx="5" fill="#e0f2fe" stroke="#475569" stroke-width="2"/><text x="270" y="131" text-anchor="middle" font-family="Arial" font-size="19" fill="#1e293b">Kalem</text><text x="510" y="131" text-anchor="middle" font-family="Arial" font-size="19" fill="#1e293b">6</text><rect x="130" y="155" width="460" height="55" rx="5" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="270" y="191" text-anchor="middle" font-family="Arial" font-size="19" fill="#1e293b">Defter</text><text x="510" y="191" text-anchor="middle" font-family="Arial" font-size="19" fill="#1e293b">9</text></svg>
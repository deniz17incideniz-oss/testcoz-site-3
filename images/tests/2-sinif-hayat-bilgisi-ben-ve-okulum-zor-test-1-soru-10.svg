<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 478" role="img" aria-labelledby="title desc"><title id="title">Sorundan çözüme</title><desc id="desc">Ben ve Okulum görselindeki olay “Grup çalışmasında iki öğrenci aynı görevi istiyor” diye başlıyor ve “grup görevini zamanında ve uyum içinde tamamladı” diye bitiyor. Uygun ara adım hangisidir?</desc><style>.title{font:700 24px Arial,sans-serif;fill:#1E3A8A}.label{font:600 15px Arial,sans-serif;fill:#334155}.small{font:500 14px Arial,sans-serif;fill:#475569}.value{font:700 17px Arial,sans-serif;fill:#1E293B}.coin{font:700 18px Arial,sans-serif;fill:#92400E}.equation{font:700 36px Arial,sans-serif;fill:#1E3A8A}</style><rect width="720" height="478" rx="24" fill="#F8FAFC"/><rect x="18" y="18" width="684" height="442" rx="20" fill="#fff" stroke="#DBEAFE" stroke-width="3"/><text x="360" y="65" text-anchor="middle" class="title">Sorundan çözüme</text><rect x="45" y="96" width="630" height="104" rx="5" fill="#f1f5f9" stroke="#2563eb" stroke-width="2"/><text x="65" y="123" class="value">Bilgi</text><text x="65" y="153" style="font:22px Arial;fill:#1f2937">Grup çalışmasında iki öğrenci aynı görevi</text><text x="65" y="183" style="font:22px Arial;fill:#1f2937">istiyor</text><rect x="45" y="214" width="630" height="104" rx="5" fill="#f1f5f9" stroke="#2563eb" stroke-width="2"/><text x="65" y="241" class="value">Bilgi</text><text x="65" y="271" style="font:22px Arial;fill:#1f2937">öğrencileri dinleyip görevleri adil biçimde</text><text x="65" y="301" style="font:22px Arial;fill:#1f2937">yeniden paylaşmak</text><rect x="45" y="332" width="630" height="104" rx="5" fill="#f1f5f9" stroke="#2563eb" stroke-width="2"/><text x="65" y="359" class="value">Bilgi</text><text x="65" y="389" style="font:22px Arial;fill:#1f2937">grup görevini zamanında ve uyum içinde</text><text x="65" y="419" style="font:22px Arial;fill:#1f2937">tamamladı</text></svg>
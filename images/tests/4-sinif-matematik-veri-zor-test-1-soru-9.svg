<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 515" role="img" aria-labelledby="title desc"><title id="title">Ödünç alınan kitaplar</title><desc id="desc">Bir okulda 4-A ve 4-B sınıflarının bir haftada kütüphaneden ödünç aldığı kitap türleri grafikte gösterilmiştir.

I. İki sınıfın ödünç aldığı toplam şiir kitabı sayısı 20’dir.
II. 4-A’nın masal kitabı sayısı, 4-B’ninkinden 8 fazladır.
III. 4-B’nin toplam kitap sayısı, 4-A’nın toplamından 4 fazladır.

Grafiğe göre hangi ifadeler doğrudur?</desc><style>.title{font:700 24px Arial,sans-serif;fill:#1E3A8A}.label{font:600 15px Arial,sans-serif;fill:#334155}.small{font:500 14px Arial,sans-serif;fill:#475569}.value{font:700 17px Arial,sans-serif;fill:#1E293B}.coin{font:700 18px Arial,sans-serif;fill:#92400E}.equation{font:700 36px Arial,sans-serif;fill:#1E3A8A}</style><rect width="360" height="515" rx="24" fill="#F8FAFC"/><rect x="18" y="18" width="324" height="479" rx="20" fill="#fff" stroke="#DBEAFE" stroke-width="3"/><text x="180" y="65" text-anchor="middle" class="title">Ödünç alınan kitaplar</text><text x="180" y="105" text-anchor="middle" style="font:600 21px Arial;fill:#334155">Her kare 4 kitabı gösterir.</text><rect x="24" y="125" width="312" height="175" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="180" y="157" text-anchor="middle" style="font:700 24px Arial;fill:#1e293b">4-A</text><text x="38" y="199" style="font:600 22px Arial;fill:#334155">Masal</text><rect x="129" y="179" width="25" height="25" rx="4" fill="#2563eb"/><rect x="167" y="179" width="25" height="25" rx="4" fill="#2563eb"/><rect x="205" y="179" width="25" height="25" rx="4" fill="#2563eb"/><rect x="243" y="179" width="25" height="25" rx="4" fill="#2563eb"/><rect x="281" y="179" width="25" height="25" rx="4" fill="#2563eb"/><text x="38" y="241" style="font:600 22px Arial;fill:#334155">Bilim</text><rect x="129" y="221" width="25" height="25" rx="4" fill="#2563eb"/><rect x="167" y="221" width="25" height="25" rx="4" fill="#2563eb"/><rect x="205" y="221" width="25" height="25" rx="4" fill="#2563eb"/><text x="38" y="283" style="font:600 22px Arial;fill:#334155">Şiir</text><rect x="129" y="263" width="25" height="25" rx="4" fill="#2563eb"/><rect x="167" y="263" width="25" height="25" rx="4" fill="#2563eb"/><rect x="24" y="315" width="312" height="175" rx="18" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="180" y="347" text-anchor="middle" style="font:700 24px Arial;fill:#1e293b">4-B</text><text x="38" y="389" style="font:600 22px Arial;fill:#334155">Masal</text><rect x="129" y="369" width="25" height="25" rx="4" fill="#0f766e"/><rect x="167" y="369" width="25" height="25" rx="4" fill="#0f766e"/><rect x="205" y="369" width="25" height="25" rx="4" fill="#0f766e"/><text x="38" y="431" style="font:600 22px Arial;fill:#334155">Bilim</text><rect x="129" y="411" width="25" height="25" rx="4" fill="#0f766e"/><rect x="167" y="411" width="25" height="25" rx="4" fill="#0f766e"/><rect x="205" y="411" width="25" height="25" rx="4" fill="#0f766e"/><rect x="243" y="411" width="25" height="25" rx="4" fill="#0f766e"/><rect x="281" y="411" width="25" height="25" rx="4" fill="#0f766e"/><text x="38" y="473" style="font:600 22px Arial;fill:#334155">Şiir</text><rect x="129" y="453" width="25" height="25" rx="4" fill="#0f766e"/><rect x="167" y="453" width="25" height="25" rx="4" fill="#0f766e"/><rect x="205" y="453" width="25" height="25" rx="4" fill="#0f766e"/></svg>
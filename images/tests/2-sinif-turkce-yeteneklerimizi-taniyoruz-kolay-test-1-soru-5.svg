<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 388" role="img" aria-labelledby="title desc"><title id="title">Olay sırası</title><desc id="desc">Yeteneklerimizi Tanıyoruz olayının üç adımı görselde verilmiştir. İlk adım hangisidir?</desc><style>.title{font:700 24px Arial,sans-serif;fill:#1E3A8A}.label{font:600 15px Arial,sans-serif;fill:#334155}.small{font:500 14px Arial,sans-serif;fill:#475569}.value{font:700 17px Arial,sans-serif;fill:#1E293B}.coin{font:700 18px Arial,sans-serif;fill:#92400E}.equation{font:700 36px Arial,sans-serif;fill:#1E3A8A}</style><rect width="720" height="388" rx="24" fill="#F8FAFC"/><rect x="18" y="18" width="684" height="352" rx="20" fill="#fff" stroke="#DBEAFE" stroke-width="3"/><text x="360" y="65" text-anchor="middle" class="title">Olay sırası</text><rect x="45" y="96" width="630" height="74" rx="5" fill="#f1f5f9" stroke="#2563eb" stroke-width="2"/><text x="65" y="123" class="value">A</text><text x="65" y="153" style="font:22px Arial;fill:#1f2937">Selin ritmi dinledi</text><rect x="45" y="184" width="630" height="74" rx="5" fill="#f1f5f9" stroke="#2563eb" stroke-width="2"/><text x="65" y="211" class="value">B</text><text x="65" y="241" style="font:22px Arial;fill:#1f2937">Zor bölümleri tekrar etti</text><rect x="45" y="272" width="630" height="74" rx="5" fill="#f1f5f9" stroke="#2563eb" stroke-width="2"/><text x="65" y="299" class="value">Bilgi</text><text x="65" y="329" style="font:22px Arial;fill:#1f2937">Grup gösterisine katıldı</text></svg>